# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cross-Platform E2E

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      supports_mobile: ${{ steps.manifest.outputs.supports_mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        run: |
          is_desktop_only=$(node -p "Boolean(require('./manifest.json').isDesktopOnly)")
          if [ "$is_desktop_only" = "true" ]; then
            echo "supports_mobile=false" >> "$GITHUB_OUTPUT"
          else
            echo "supports_mobile=true" >> "$GITHUB_OUTPUT"
          fi

  test-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: E2E Desktop (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm run check:mobile

      - name: Get Obsidian cache key
        run: |
          npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}

      - name: Cache Obsidian
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ matrix.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      - if: ${{ matrix.os == 'ubuntu-latest' }}
        name: Setup virtual graphics
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*.list
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

          sudo apt-get update -q
          sudo apt-get install -q herbstluftwm dzen2 x11-xserver-utils

          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          WDIO_MAX_INSTANCES: 2
          OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}

  test-android:
    needs: [detect]
    if: ${{ needs.detect.outputs.supports_mobile == 'true' }}
    env:
      AVD_ARGS: '-no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
    strategy:
      fail-fast: false
      matrix:
        include:
          - obsidian-version: latest
            android-api-level: 36
            android-profile: pixel
          - obsidian-version: earliest
            android-api-level: 36
            android-profile: pixel
    runs-on: ubuntu-latest
    name: E2E Android (api ${{ matrix.android-api-level }}, obsidian ${{ matrix.obsidian-version }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm run check:mobile

      - name: Get Obsidian cache key
        run: |
          npx tsx wdio.mobile.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}

      - name: Cache Obsidian Android APK
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-cache-android-${{ hashFiles('obsidian-versions-lock.txt') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.android-api-level }}-${{ matrix.android-profile }}

      - name: Run Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          force-avd-creation: false
          avd-name: obsidian_test
          emulator-options: -no-snapshot ${{ env.AVD_ARGS }}
          api-level: ${{ matrix.android-api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.android-profile }}
          disk-size: 4096M
          heap-size: 512M
          script: npm run test:e2e:android
        env:
          OBSIDIAN_VERSIONS: ${{ matrix.obsidian-version }}
          OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
          OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}

  check:
    if: always()
    needs: [test-desktop, test-android]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required E2E jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
